```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Outward Entry - Hanawal Gram Panchayat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7f4;
      min-height: 100vh;
    }

    header {
      background: #2e7d32;
      color: white;
      padding: 16px 20px;
    }

    header h1 {
      font-size: 20px;
    }

    header p {
      font-size: 13px;
      margin-top: 4px;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      gap: 10px;
    }

    .top h2 {
      color: #333;
    }

    .back-btn {
      text-decoration: none;
      background: #555;
      color: white;
      padding: 9px 14px;
      border-radius: 7px;
      font-size: 14px;
    }

    .form-box {
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: bold;
      color: #333;
      margin-bottom: 7px;
      font-size: 14px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #2e7d32;
    }

    .required {
      color: red;
    }

    .outward-number {
      background: #fff8e1;
      font-weight: bold;
      color: #e65100;
    }

    .save-btn {
      width: 100%;
      padding: 14px;
      background: #ef6c00;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .save-btn:hover {
      background: #e65100;
    }

    .success {
      display: none;
      margin-top: 15px;
      padding: 12px;
      background: #fff3e0;
      color: #e65100;

      text-align: center;
      font-weight: bold;
    }

    .note {
      margin-top: 12px;
      font-size: 12px;
      color: #777;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<header>
  <h1>Hanawal Gram Panchayat</h1>
  <p>Inward &amp; Outward Register</p>
</header>

<div class="container">

  <div class="top">
    <h2>📤 Outward Entry</h2>

    <a href="dashboard.html" class="back-btn">
      ← Dashboard
    </a>
  </div>

  <div class="form-box">

    <form id="outwardForm">

      <div class="form-group">
        <label>Outward Number</label>

        <input
          type="text"
          id="outwardNo"
          class="outward-number"
          readonly
        >
      </div>

      <div class="form-group">
        <label>
          Date <span class="required">*</span>
        </label>

        <input
          type="date"
          id="date"
          required
        >
      </div>

      <div class="form-group">
        <label>Reference / Letter Number</label>

        <input
          type="text"
          id="letterNo"
          placeholder="Enter reference number"
        >
      </div>

      <div class="form-group">
        <label>
          To / Sent To <span class="required">*</span>
        </label>

        <input
          type="text"
          id="to"
          placeholder="Example: Tahsildar Office"
          required
        >
      </div>

      <div class="form-group">
        <label>
          Subject <span class="required">*</span>
        </label>

        <textarea
          id="subject"
          placeholder="Enter subject"
          required
        ></textarea>
      </div>

      <div class="form-group">
        <label>Sent By</label>

        <input
          type="text"
          id="sentBy"
          placeholder="Enter name"
        >
      </div>

      <div class="form-group">
        <label>Delivery Mode</label>

        <select id="deliveryMode">

          <option value="">
            Select delivery mode
          </option>

          <option value="Post">
            Post
          </option>

          <option value="Registered Post">
            Registered Post
          </option>

          <option value="Speed Post">
            Speed Post
          </option>

          <option value="Email">
            Email
          </option>

          <option value="Hand Delivery">
            Hand Delivery
          </option>

          <option value="Other">
            Other
          </option>

        </select>
      </div>

      <div class="form-group">
        <label>Remarks</label>

        <textarea
          id="remarks"
          placeholder="Enter remarks"
        ></textarea>
      </div>

      <div class="form-group">
        <label>Upload Document</label>

        <input
          type="file"
          id="document"
          accept=".pdf,.jpg,.jpeg,.png"
        >
      </div>

      <button type="submit" class="save-btn">
        💾 Save Outward
      </button>

      <div id="successMessage" class="success">
        Outward entry saved successfully!
      </div>

      <div class="note">
        Note: ಈಗ entry registerRecordsನಲ್ಲಿ save ಆಗುತ್ತದೆ.
        Document upload storage ಅನ್ನು ಮುಂದಿನ ಹಂತದಲ್ಲಿ ಸೇರಿಸಲಾಗುತ್ತದೆ.
      </div>

    </form>

  </div>

</div>

<script>

  // Login protection
  if (localStorage.getItem("loggedIn") !== "true") {
    window.location.href = "index.html";
  }


  // Today's date
  const today =
    new Date().toISOString().split("T")[0];

  document.getElementById("date").value = today;


  // Get existing records
  function getRecords() {

    return JSON.parse(
      localStorage.getItem("registerRecords") || "[]"
    );

  }


  // Generate next Outward number
  function getNextOutwardNumber() {

    const records = getRecords();

    const outwardRecords =
      records.filter(
        record => record.type === "outward"
      );

    const nextNumber =
      outwardRecords.length + 1;

    return "OUT-" +
      String(nextNumber).padStart(3, "0");

  }


  // Show number when page opens
  document.getElementById("outwardNo").value =
    getNextOutwardNumber();


  // Save Outward
  document.getElementById("outwardForm")
    .addEventListener("submit", function(event) {

      event.preventDefault();


      const records = getRecords();


      const record = {

        id:
          Date.now().toString(),

        type:
          "outward",

        number:
          document.getElementById("outwardNo").value,

        date:
          document.getElementById("date").value,

        letterNo:
          document.getElementById("letterNo").value.trim(),

        name:
          document.getElementById("to").value.trim(),

        subject:
          document.getElementById("subject").value.trim(),

        person:
          document.getElementById("sentBy").value.trim(),

        delivery:
          document.getElementById("deliveryMode").value,

        remarks:
          document.getElementById("remarks").value.trim(),

        createdAt:
          new Date().toISOString()

      };


      // Add new record
      records.push(record);


      // Save records
      localStorage.setItem(
        "registerRecords",
        JSON.stringify(records)
      );


      // Update counters
      const totalOutward =
        records.filter(
          r => r.type === "outward"
        ).length;

      const todayOutward =
        records.filter(
          r =>
            r.type === "outward" &&
            r.date === today
        ).length;


      localStorage.setItem(
        "totalOutward",
        totalOutward
      );

      localStorage.setItem(
        "todayOutward",
        todayOutward
      );


      // Show success
      document.getElementById(
        "successMessage"
      ).style.display = "block";


      // Reset form
      document.getElementById(
        "outwardForm"
      ).reset();


      // Set today's date again
      document.getElementById(
        "date"
      ).value = today;


      // Generate next number
      document.getElementById(
        "outwardNo"
      ).value = getNextOutwardNumber();


      // Hide success message
      setTimeout(function() {

        document.getElementById(
          "successMessage"
        ).style.display = "none";

      }, 3000);

    });

</script>

</body>
</html>
