<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reports - Hanawal Gram Panchayat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7f4;
      min-height: 100vh;
    }

    header {
      background: #455a64;
      color: white;
      padding: 16px 20px;
    }

    header h1 {
      font-size: 20px;
    }

    header p {
      font-size: 13px;
      margin-top: 4px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .top h2 {
      color: #333;
    }

    .back-btn {
      text-decoration: none;
      background: #555;
      color: white;
      padding: 9px 14px;
      border-radius: 7px;
      font-size: 14px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      text-align: center;
    }

    .card .icon {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .card h3 {
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
    }

    .card .number {
      font-size: 30px;
      font-weight: bold;
      color: #333;
    }

    .filter-box {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 6px;
      color: #333;
    }

    input,
    select {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 11px 18px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .apply-btn {
      background: #455a64;
      color: white;
    }

    .clear-btn {
      background: #e0e0e0;
      color: #333;
    }

    .print-btn {
      background: #2e7d32;
      color: white;
    }

    .status {
      display: none;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .loading {
      background: #e3f2fd;
      color: #1565c0;
    }

    .error {
      background: #ffebee;
      color: #c62828;
    }

    .table-box {
      background: white;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      overflow-x: auto;
    }

    .table-header {
      padding: 15px 18px;
      border-bottom: 1px solid #ddd;
      font-weight: bold;
    }

    table {
      width: 100%;
      min-width: 900px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 11px;
      border-bottom: 1px solid #eee;
      text-align: left;
      font-size: 13px;
    }

    th {
      background: #f5f5f5;
    }

    .inward {
      color: #1565c0;
      font-weight: bold;
    }

    .outward {
      color: #ef6c00;
      font-weight: bold;
    }

    .no-records {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    @media (max-width: 700px) {

      .cards {
        grid-template-columns: 1fr;
      }

      .filter-grid {
        grid-template-columns: 1fr;
      }

      .buttons {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }

    @media print {

      header,
      .top,
      .filter-box,
      .cards,
      .status {
        display: none !important;
      }

      body {
        background: white;
      }

      .container {
        max-width: 100%;
        padding: 0;
      }

      .table-box {
        box-shadow: none;
      }

      table {
        min-width: 0;
      }

      th,
      td {
        font-size: 10px;
        padding: 6px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Hanawal Gram Panchayat</h1>
  <p>Inward &amp; Outward Register - Reports</p>
</header>

<div class="container">

  <div class="top">
    <h2>📊 Reports</h2>

    <a
      href="dashboard.html"
      class="back-btn"
    >
      ← Dashboard
    </a>
  </div>


  <!-- SUMMARY CARDS -->

  <div class="cards">

    <div class="card">
      <div class="icon">📋</div>
      <h3>Total Records</h3>
      <div
        class="number"
        id="totalRecords"
      >
        0
      </div>
    </div>


    <div class="card">
      <div class="icon">📥</div>
      <h3>Total Inward</h3>
      <div
        class="number"
        id="totalInward"
      >
        0
      </div>
    </div>


    <div class="card">
      <div class="icon">📤</div>
      <h3>Total Outward</h3>
      <div
        class="number"
        id="totalOutward"
      >
        0
      </div>
    </div>

  </div>


  <!-- FILTER -->

  <div class="filter-box">

    <div class="filter-grid">

      <div class="field">
        <label>Register Type</label>

        <select id="type">

          <option value="">
            All
          </option>

          <option value="Inward">
            Inward
          </option>

          <option value="Outward">
            Outward
          </option>

        </select>
      </div>


      <div class="field">
        <label>From Date</label>

        <input
          type="date"
          id="fromDate"
        >
      </div>


      <div class="field">
        <label>To Date</label>

        <input
          type="date"
          id="toDate"
        >
      </div>

    </div>


    <div class="buttons">

      <button
        class="apply-btn"
        onclick="applyFilter()"
      >
        🔎 Apply Filter
      </button>

      <button
        class="clear-btn"
        onclick="clearFilter()"
      >
        Clear
      </button>

      <button
        class="print-btn"
        onclick="window.print()"
      >
        🖨️ Print / PDF
      </button>

    </div>

  </div>


  <div
    id="loading"
    class="status loading"
  >
    Loading records...
  </div>


  <div
    id="error"
    class="status error"
  ></div>


  <!-- RECORD TABLE -->

  <div class="table-box">

    <div class="table-header">
      Register Records
    </div>

    <table>

      <thead>

        <tr>
          <th>Type</th>
          <th>Number</th>
          <th>Date</th>
          <th>Name / From / To</th>
          <th>Letter No.</th>
          <th>Subject</th>
          <th>Person</th>
          <th>Delivery</th>
        </tr>

      </thead>

      <tbody id="results">

        <tr>
          <td
            colspan="8"
            class="no-records"
          >
            Loading...
          </td>
        </tr>

      </tbody>

    </table>

  </div>

</div>


<script>

  /* SUPABASE CONFIGURATION */

  const SUPABASE_URL =
    "https://hmexumitktsxswcqdeef.supabase.co";

  const SUPABASE_ANON_KEY =
    "PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE";


  let allRecords = [];


  /* LOAD ALL RECORDS */

  async function loadRecords() {

    const loading =
      document.getElementById("loading");

    const errorBox =
      document.getElementById("error");

    loading.style.display =
      "block";

    errorBox.style.display =
      "none";


    try {

      const response =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/register_records?select=*&order=date.desc,created_at.desc",
          {
            method: "GET",

            headers: {

              "apikey":
                SUPABASE_ANON_KEY,

              "Authorization":
                "Bearer " +
                SUPABASE_ANON_KEY
            }
          }
        );


      if (!response.ok) {

        const message =
          await response.text();

        throw new Error(message);

      }


      allRecords =
        await response.json();


      updateSummary(
        allRecords
      );

      displayRecords(
        allRecords
      );

    }

    catch (error) {

      console.error(error);

      errorBox.textContent =
        "Records load ಆಗಲಿಲ್ಲ. Supabase connection ಅಥವಾ key check ಮಾಡಿ.";

      errorBox.style.display =
        "block";

    }

    finally {

      loading.style.display =
        "none";

    }

  }


  /* UPDATE SUMMARY */

  function updateSummary(records) {

    const inward =
      records.filter(
        record =>
          String(record.type)
            .toLowerCase()
            === "inward"
      ).length;


    const outward =
      records.filter(
        record =>
          String(record.type)
            .toLowerCase()
            === "outward"
      ).length;


    document.getElementById(
      "totalRecords"
    ).textContent =
      records.length;


    document.getElementById(
      "totalInward"
    ).textContent =
      inward;


    document.getElementById(
      "totalOutward"
    ).textContent =
      outward;

  }


  /* APPLY FILTER */

  function applyFilter() {

    const type =
      document.getElementById(
        "type"
      ).value
      .toLowerCase();


    const fromDate =
      document.getElementById(
        "fromDate"
      ).value;


    const toDate =
      document.getElementById(
        "toDate"
      ).value;


    const filtered =
      allRecords.filter(
        function(record) {

          const recordType =
            String(
              record.type || ""
            ).toLowerCase();


          const recordDate =
            String(
              record.date || ""
            );


          if (
            type &&
            recordType !== type
          ) {
            return false;
          }


          if (
            fromDate &&
            recordDate < fromDate
          ) {
            return false;
          }


          if (
            toDate &&
            recordDate > toDate
          ) {
            return false;
          }


          return true;

        }
      );


    updateSummary(
      filtered
    );

    displayRecords(
      filtered
    );

  }


  /* CLEAR FILTER */

  function clearFilter() {

    document.getElementById(
      "type"
    ).value = "";


    document.getElementById(
      "fromDate"
    ).value = "";


    document.getElementById(
      "toDate"
    ).value = "";


    updateSummary(
      allRecords
    );


    displayRecords(
      allRecords
    );

  }


  /* DISPLAY TABLE */

  function displayRecords(records) {

    const tbody =
      document.getElementById(
        "results"
      );


    if (!records.length) {

      tbody.innerHTML = `
        <tr>
          <td
            colspan="8"
            class="no-records"
          >
            No records found
          </td>
        </tr>
      `;

      return;

    }


    tbody.innerHTML =
      records.map(
        function(record) {

          const type =
            String(
              record.type || ""
            );


          const typeClass =
            type.toLowerCase()
              === "inward"
              ? "inward"
              : "outward";


          return `
            <tr>

              <td class="${typeClass}">
                ${escapeHTML(type)}
              </td>

              <td>
                ${escapeHTML(record.number)}
              </td>

              <td>
                ${escapeHTML(record.date)}
              </td>

              <td>
                ${escapeHTML(record.name)}
              </td>

              <td>
                ${escapeHTML(record.letter_no)}
              </td>

              <td>
                ${escapeHTML(record.subject)}
              </td>

              <td>
                ${escapeHTML(record.person)}
              </td>

              <td>
                ${escapeHTML(record.delivery)}
              </td>

            </tr>
          `;

        }
      ).join("");

  }


  /* ESCAPE HTML */

  function escapeHTML(value) {

    if (
      value === null ||
      value === undefined
    ) {
      return "";
    }


    return String(value)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  /* START */

  loadRecords();

</script>

</body>
</html>
