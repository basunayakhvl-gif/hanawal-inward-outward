<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hanawal Gram Panchayat - Inward & Outward Register</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #e8f5e9, #e3f2fd);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 18px;
      padding: 30px 25px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      width: 75px;
      height: 75px;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: #2e7d32;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: bold;
    }

    .header h1 {
      font-size: 22px;
      color: #1b5e20;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 15px;
      color: #555;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #333;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2e7d32;
      box-shadow: 0 0 0 2px rgba(46, 125, 50, 0.1);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #2e7d32;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .login-btn:hover {
      background: #1b5e20;
    }

    .error {
      display: none;
      margin-top: 15px;
      padding: 10px;
      background: #ffebee;
      color: #c62828;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
    }

    .footer {
      text-align: center;
      margin-top: 22px;
      color: #777;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="login-container">

    <div class="header">
      <div class="logo">GP</div>

      <h1>Hanawal Gram Panchayat</h1>

      <p>
        Inward &amp; Outward Register
      </p>
    </div>

    <form id="loginForm">

      <div class="form-group">
        <label for="username">Username</label>

        <input
          type="text"
          id="username"
          placeholder="Enter username"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          placeholder="Enter password"
          required
        >
      </div>

      <button type="submit" class="login-btn">
        Login
      </button>

      <div id="errorMessage" class="error">
        Invalid username or password
      </div>

    </form>

    <div class="footer">
      Hanawal Gram Panchayat
    </div>

  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {

      event.preventDefault();

      const username =
        document.getElementById("username").value.trim();

      const password =
        document.getElementById("password").value;

      /*
        Temporary login for testing.

        Username: admin
        Password: 1234
      */

      if (username === "admin" && password === "1234") {

        localStorage.setItem("loggedIn", "true");

        alert("Login successful!");

        window.location.href = "dashboard.html";

      } else {

        document.getElementById("errorMessage").style.display = "block";

      }

    });
  </script>

</body>
</html>

<script>
  document.getElementById("loginForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const username =
      document.getElementById("username").value.trim();

    const password =
      document.getElementById("password").value;

    // Use changed password if available, otherwise default to 1234
    const savedPassword =
      localStorage.getItem("hanawalPassword") || "1234";

    if (username === "admin" && password === savedPassword) {

      localStorage.setItem("loggedIn", "true");

      alert("Login successful!");

      window.location.href = "dashboard.html";

    } else {

      document.getElementById("errorMessage").style.display = "block";

    }

  });
</script>
