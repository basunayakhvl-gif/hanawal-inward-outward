<script>
document.getElementById("loginForm").addEventListener("submit", function(event) {

  event.preventDefault();

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value;

  /*
    Username remains:
    admin

    First/default password:
    1234

    After changing password from Dashboard,
    the new password is stored in this browser.
  */

  const savedPassword =
    localStorage.getItem("hanawalPassword") || "1234";

  if (
    username === "admin" &&
    password === savedPassword
  ) {

    localStorage.setItem(
      "loggedIn",
      "true"
    );

    alert("Login successful!");

    window.location.href =
      "dashboard.html";

  } else {

    document.getElementById(
      "errorMessage"
    ).style.display = "block";

  }

});
</script>
