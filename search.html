```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Search Register - Hanawal Gram Panchayat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7f4;

    }

      background: #2e7d32;

      font-size: 20px;
    }

    header p {
      font-size: 13px;
      margin-top: 4px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .top {
      display: flex;
      justify-content: space-between;

      display: flex;

</head>

<body>

<header>
  <h1>Hanawal Gram Panchayat</h1>
  <p>Inward &amp; Outward Register</p>
</header>

<div class="container">

  <div class="top">
    <h2>🔎 Search Register</h2>

    <a href="dashboard.html" class="back-btn">
      ← Dashboard
    </a>
  </div>

  <div class="search-box">

    <div class="filters">

      <div>
        <label>Register Type</label>

        <select id="type">
          <option value="all">All</option>
          <option value="inward">Inward</option>
          <option value="outward">Outward</option>
        </select>
      </div>

      <div>
        <label>Number</label>

        <input
          type="text"
          id="number"
          placeholder="IN-001 / OUT-001"
        >
      </div>

      <div>
        <label>From / To</label>

        <input
          type="text"
          id="name"
          placeholder="Office / Person"
        >
      </div>

      <div>
        <label>From Date</label>

        <input type="date" id="fromDate">
      </div>

      <div>
        <label>To Date</label>

        <input type="date" id="toDate">
      </div>

      <div>
        <label>Subject</label>

        <input
          type="text"
          id="subject"
          placeholder="Search subject"
        >
      </div>

    </div>

    <div class="buttons">

      <button class="search-btn" onclick="searchRegister()">
        🔎 Search
      </button>

      <button class="clear-btn" onclick="clearSearch()">
        Clear
      </button>

    </div>

  </div>

  <div class="count" id="resultCount">
    Showing 0 records
  </div>

  <div id="emptyMessage" class="empty-message">
    ಯಾವುದೇ Inward ಅಥವಾ Outward ದಾಖಲೆಗಳು ಇನ್ನೂ ಇಲ್ಲ.
  </div>

  <div class="table-box">

    <table>

      <thead>
        <tr>
          <th>Type</th>
          <th>Number</th>
          <th>Date</th>
          <th>From / To</th>
          <th>Letter No.</th>
          <th>Subject</th>
          <th>Person</th>
          <th>Delivery</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody id="results">

        <tr>
          <td colspan="9" class="no-data">
            No records found
          </td>
        </tr>

      </tbody>

    </table>

  </div>

</div>

<script>

  // Login protection
  if (localStorage.getItem("loggedIn") !== "true") {
    window.location.href = "index.html";
  }


  // Get saved records
  function getRecords() {

    return JSON.parse(
      localStorage.getItem("registerRecords") || "[]"
    );

  }


  // Search
  function searchRegister() {

    const type =
      document.getElementById("type").value;

    const number =
      document.getElementById("number").value
      .trim()
      .toLowerCase();

    const name =
      document.getElementById("name").value
      .trim()
      .toLowerCase();

    const fromDate =
      document.getElementById("fromDate").value;

    const toDate =
      document.getElementById("toDate").value;

    const subject =
      document.getElementById("subject").value
      .trim()
      .toLowerCase();


    const records = getRecords();


    const filtered = records.filter(function(record) {

      if (
        type !== "all" &&
        record.type !== type
      ) {
        return false;
      }


      if (
        number &&
        !String(record.number || "")
        .toLowerCase()
        .includes(number)
      ) {
        return false;
      }


      if (
        name &&
        !String(record.name || "")
        .toLowerCase()
        .includes(name)
      ) {
        return false;
      }


      if (
        fromDate &&
        record.date < fromDate
      ) {
        return false;
      }


      if (
        toDate &&
        record.date > toDate
      ) {
        return false;
      }


      if (
        subject &&
        !String(record.subject || "")
        .toLowerCase()
        .includes(subject)
      ) {
        return false;
      }


      return true;

    });


    displayResults(filtered);

  }


  // Display records
  function displayResults(data) {

    const results =
      document.getElementById("results");

    const emptyMessage =
      document.getElementById("emptyMessage");


    results.innerHTML = "";


    document.getElementById("resultCount").textContent =
      "Showing " + data.length + " records";


    if (data.length === 0) {

      results.innerHTML = `
        <tr>
          <td colspan="9" class="no-data">
            No records found
          </td>
        </tr>
      `;

      return;

    }


    data.forEach(function(record) {

      const row =
        document.createElement("tr");


      const typeText =
        record.type === "inward"
        ? "INWARD"
        : "OUTWARD";


      row.innerHTML = `

        <td class="${record.type}">
          ${typeText}
        </td>

        <td>
          ${escapeHTML(record.number)}
        </td>

        <td>
          ${escapeHTML(record.date)}
        </td>

        <td>
          ${escapeHTML(record.name)}
        </td>

        <td>
          ${escapeHTML(record.letterNo || "-")}
        </td>

        <td>
          ${escapeHTML(record.subject)}
        </td>

        <td>
          ${escapeHTML(record.person || "-")}
        </td>

        <td>
          ${escapeHTML(record.delivery || "-")}
        </td>

        <td>

          <button
            class="action-btn"
            onclick="viewRecord('${record.id}')"
          >
            View
          </button>

          <button
            class="delete-btn"
            onclick="deleteRecord('${record.id}')"
          >
            Delete
          </button>

        </td>

      `;


      results.appendChild(row);

    });

  }


  // View record
  function viewRecord(id) {

    const records = getRecords();

    const record =
      records.find(r => String(r.id) === String(id));


    if (!record) {

      alert("Record not found.");

      return;

    }


    alert(

      "Register: " +
      record.type.toUpperCase() +

      "\n\nNumber: " +
      record.number +

      "\nDate: " +
      record.date +

      "\nFrom / To: " +
      record.name +

      "\nLetter No: " +
      (record.letterNo || "-") +

      "\nSubject: " +
      record.subject +

      "\nPerson: " +
      (record.person || "-") +

      "\nDelivery: " +
      (record.delivery || "-") +

      "\nRemarks: " +
      (record.remarks || "-")

    );

  }


  // Delete record
  function deleteRecord(id) {

    if (
      !confirm(
        "ಈ ದಾಖಲೆಯನ್ನು delete ಮಾಡಬೇಕೇ?"
      )
    ) {
      return;
    }


    let records = getRecords();


    records =
      records.filter(
        r => String(r.id) !== String(id)
      );


    localStorage.setItem(
      "registerRecords",
      JSON.stringify(records)
    );


    searchRegister();

  }


  // Clear filters
  function clearSearch() {

    document.getElementById("type").value =
      "all";

    document.getElementById("number").value =
      "";

    document.getElementById("name").value =
      "";

    document.getElementById("fromDate").value =
      "";

    document.getElementById("toDate").value =
      "";

    document.getElementById("subject").value =
      "";


    displayResults(getRecords());

  }


  // Security helper
  function escapeHTML(value) {

    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  // Show all records when page opens
  displayResults(getRecords());

</script>

</body>
</html>
