```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Search Register - Hanawal Gram Panchayat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7f4;

    }

      font-size: 13px;

    }

    .container {
      max-width: 1100px;

    }

    .top {
      display: flex;
      justify-content: space-between;

    .top h2 {

      display: grid;

    }

      display: block;

    select {

    input:focus,
    select:focus {
      border-color: #2e7d32;

      display: flex;

    button {

      background: #2e7d32;

      background: #777;

      width: 100%;

  </style>
</head>

<body>

  <header>
    <h1>Hanawal Gram Panchayat</h1>
    <p>Inward &amp; Outward Register</p>
  </header>

  <div class="container">

    <div class="top">
      <h2>🔎 Search Register</h2>

      <a href="dashboard.html" class="back-btn">
        ← Dashboard
      </a>
    </div>

    <div class="search-box">

      <div class="filters">

        <div>
          <label>Register Type</label>

          <select id="type">
            <option value="all">All</option>
            <option value="inward">Inward</option>
            <option value="outward">Outward</option>
          </select>
        </div>

        <div>
          <label>Search Number</label>

          <input
            type="text"
            id="number"
            placeholder="IN-001 / OUT-001"
          >
        </div>

        <div>
          <label>Search Name / Office</label>

          <input
            type="text"
            id="name"
            placeholder="From / To"
          >
        </div>

        <div>
          <label>From Date</label>

          <input type="date" id="fromDate">
        </div>

        <div>
          <label>To Date</label>

          <input type="date" id="toDate">
        </div>

        <div>
          <label>Subject</label>

          <input
            type="text"
            id="subject"
            placeholder="Search subject"
          >
        </div>

      </div>

      <div class="buttons">

        <button class="search-btn" onclick="searchRegister()">
          🔎 Search
        </button>

        <button class="clear-btn" onclick="clearSearch()">
          Clear
        </button>

      </div>

    </div>

    <div class="count" id="resultCount">
      Showing 0 records
    </div>

    <div class="table-box">

      <table>

        <thead>
          <tr>
            <th>Type</th>
            <th>Number</th>
            <th>Date</th>
            <th>From / To</th>
            <th>Letter No</th>
            <th>Subject</th>
            <th>Person</th>
          </tr>
        </thead>

        <tbody id="results">

          <tr>
            <td colspan="7" class="no-data">
              No records found
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </div>

  <script>

    // Login protection
    if (localStorage.getItem("loggedIn") !== "true") {
      window.location.href = "index.html";
    }

    /*
      Search system structure.

      Later, when the real database is connected,
      this section will automatically load all
      Inward and Outward records.
    */

    let records = JSON.parse(
      localStorage.getItem("registerRecords") || "[]"
    );


    function searchRegister() {

      const type =
        document.getElementById("type").value;

      const number =
        document.getElementById("number").value
        .trim()
        .toLowerCase();

      const name =
        document.getElementById("name").value
        .trim()
        .toLowerCase();

      const fromDate =
        document.getElementById("fromDate").value;

      const toDate =
        document.getElementById("toDate").value;

      const subject =
        document.getElementById("subject").value
        .trim()
        .toLowerCase();


      const filtered = records.filter(function(record) {

        if (type !== "all" && record.type !== type) {
          return false;
        }

        if (
          number &&
          !record.number.toLowerCase().includes(number)
        ) {
          return false;
        }

        if (
          name &&
          !record.name.toLowerCase().includes(name)
        ) {
          return false;
        }

        if (
          fromDate &&
          record.date < fromDate
        ) {
          return false;
        }

        if (
          toDate &&
          record.date > toDate
        ) {
          return false;
        }

        if (
          subject &&
          !record.subject.toLowerCase().includes(subject)
        ) {
          return false;
        }

        return true;

      });


      displayResults(filtered);

    }


    function displayResults(data) {

      const results =
        document.getElementById("results");

      results.innerHTML = "";

      document.getElementById("resultCount").textContent =
        "Showing " + data.length + " records";


      if (data.length === 0) {

        results.innerHTML = `
          <tr>
            <td colspan="7" class="no-data">
              No records found
            </td>
          </tr>
        `;

        return;
      }


      data.forEach(function(record) {

        const row = document.createElement("tr");

        row.innerHTML = `
          <td class="${record.type}">
            ${record.type.toUpperCase()}
          </td>

          <td>${record.number}</td>

          <td>${record.date}</td>

          <td>${record.name}</td>

          <td>${record.letterNo || "-"}</td>

          <td>${record.subject}</td>

          <td>${record.person || "-"}</td>
        `;

        results.appendChild(row);

      });

    }


    function clearSearch() {

      document.getElementById("type").value = "all";

      document.getElementById("number").value = "";

      document.getElementById("name").value = "";

      document.getElementById("fromDate").value = "";

      document.getElementById("toDate").value = "";

      document.getElementById("subject").value = "";

      displayResults([]);

    }

  </script>

</body>
</html>
